[package]
name = "qmiep-python"
version = "0.1.0"
edition = "2024"
publish = false
description = "PyO3 bindings for native QMIEP unitary synthesis"

[lib]
name = "_rust"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
numpy = "0.27.1"
pyo3 = { version = "0.27.2", features = ["num-complex"] }
qmiep-synthesis = { path = "../qmiep-synthesis" }
