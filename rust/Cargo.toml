[workspace]
members = ["qmiep-solver", "qmiep-synthesis", "qmiep-python"]
resolver = "3"

[workspace.dependencies]
faer = "0.24.4"
nalgebra = "0.34"
num-complex = { version = "0.4", features = ["serde"] }
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
