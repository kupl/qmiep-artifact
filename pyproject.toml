[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "qmiep"
version = "0.1.0"
description = "Unitary synthesis based on the quantum multiplicative inverse eigenvalue problem"
readme = "README.md"
license-files = ["rust/qmiep-synthesis/LICENSE-QISKIT", "rust/qmiep-synthesis/NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "cirq>=1.7.0",
    "numpy>=2.5.1",
    "qiskit>=2.5.0",
    "rich>=14.0",
    "scipy>=1.14.0",
]
keywords = [
    "quantum-computing",
    "quantum-circuits",
    "unitary-synthesis",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest", "ply>=3.6"]
lint = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/kupl/QMIEP"
Repository = "https://github.com/kupl/QMIEP.git"
Issues = "https://github.com/kupl/QMIEP/issues"

[tool.maturin]
manifest-path = "rust/qmiep-python/Cargo.toml"
python-source = "src"
module-name = "qmiep.rust._rust"
features = ["pyo3/extension-module"]
locked = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "test"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
